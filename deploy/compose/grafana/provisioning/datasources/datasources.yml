# The data sources of Grafana in the stack, with the fixed ids the dashboards are provisioned with (`prometheus` and `mysql`).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  # The history of the runs, read from the MySQL of the stack with a user that can only read.
  - name: mediaOrquestator MySQL
    uid: mysql
    type: mysql
    access: proxy
    url: mysql:3306
    user: grafana_ro
    jsonData:
      database: ${MO_DB_NAME}
      maxOpenConns: 5
    secureJsonData:
      password: ${GRAFANA_RO_PASSWORD}
