<style>
#at{position:absolute;left:50%;top:8vh;width:84vh;margin-left:-42vh;padding:3.2vh 4vh 3.6vh;border-radius:2.4vh;background:color-mix(in srgb,var(--bg) 70%,var(--fg) 14%);border:.4vh solid color-mix(in srgb,var(--fg) 26%,transparent);box-shadow:0 2.4vh 6vh rgba(0,0,0,.35)}
#at .row{display:flex;align-items:center;gap:3vh}
#at .badge{flex:none;width:9vh;height:9vh;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--bg);font-family:var(--display);font-weight:900;font-size:5.5vh}
#at .t{font-family:var(--display);font-weight:900;font-size:3.6vh;letter-spacing:.06em;color:var(--accent)}
#at .x{font-size:4.2vh;font-weight:700;margin-top:.8vh}
#at .bar{margin-top:3vh;height:1.6vh;border-radius:1vh;background:color-mix(in srgb,var(--fg) 16%,transparent);overflow:hidden}
#at .bar i{display:block;height:100%;width:0;background:var(--accent)}
</style>
<div id="at"><div class="row"><div class="badge">&#9733;</div><div><div class="t">{{title}}</div><div class="x">{{text}}</div></div></div><div class="bar"><i></i></div></div>
<script>
(function(){
  var P = window.__params, box = document.getElementById('at'), fill = box.querySelector('.bar i');
  function ease(p){ p = Math.min(1, Math.max(0, p)); return 1 - Math.pow(1 - p, 3); }
  function easeIn(p){ p = Math.min(1, Math.max(0, p)); return p * p * p; }
  window.__partSeek = function(t, b){
    // Position, in beats, since the part began (the beat clock is the song's: before the first beat it is -1).
    var at = b.number < 0 ? 0 : b.number + b.position;
    var inP = ease(at / 0.8), outP = easeIn((at - (P.beats - 0.8)) / 0.8);
    var y = (1 - inP) * -30 + outP * -30;                       // vh: drops in from above, leaves upwards
    box.style.transform = 'translateY(' + y + 'vh)';
    box.style.opacity = String(Math.min(inP, 1 - outP));
    fill.style.width = (P.progress * Math.min(1, Math.max(0, (at - 0.6) / Math.max(1, P.beats - 2.2)))) + '%';
  };
})();
</script>
