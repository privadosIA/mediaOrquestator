<style>
#cb{position:absolute;left:0;top:0;width:100%;height:78%}
#cb .btn{position:absolute;left:50%;top:44%;min-width:52vh;padding:3.2vh 6vh;margin:-6.5vh 0 0 -26vh;border-radius:7vh;background:var(--accent);color:var(--bg);font-family:var(--display);font-weight:900;font-size:6vh;text-align:center;white-space:nowrap;box-shadow:0 1.6vh 0 color-mix(in srgb,var(--accent) 55%,black)}
#cb .cursor{position:absolute;width:6vh;height:6vh;left:0;top:0}
#cb .cursor svg{width:100%;height:100%;display:block;filter:drop-shadow(0 .3vh .4vh rgba(0,0,0,.5))}
</style>
<div id="cb"><div class="btn"></div><div class="cursor"><svg viewBox="0 0 24 24"><path d="M3 2 L3 19 L8 14.5 L11.2 21.5 L14 20.2 L10.9 13.4 L17.5 13 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg></div></div>
<script>
(function(){
  var P = window.__params, root = document.getElementById('cb'), btn = root.querySelector('.btn'), cursor = root.querySelector('.cursor');
  function ease(p){ p = Math.min(1, Math.max(0, p)); return 1 - Math.pow(1 - p, 3); }
  window.__partSeek = function(t, b){
    var at = b.number < 0 ? 0 : b.number + b.position;          // beats since the start
    var pressed = at >= P.press_beat;
    btn.textContent = pressed ? P.pressed_label : P.label;
    var W = root.clientWidth, H = root.clientHeight, r = btn.getBoundingClientRect(), rr = root.getBoundingClientRect();
    // From the lower right corner to the middle of the button, arriving on the press beat.
    var tx = r.left - rr.left + r.width * 0.55, ty = r.top - rr.top + r.height * 0.6, k = ease(at / P.press_beat);
    cursor.style.left = (W * 0.98 + (tx - W * 0.98) * k) + 'px'; cursor.style.top = (H * 1.05 + (ty - H * 1.05) * k) + 'px';
    var sink = pressed ? Math.max(0, 1 - (at - P.press_beat) / 0.3) : 0;     // the button sinks for a moment
    btn.style.transform = 'translateY(' + (sink * 1.2) + 'vh) scale(' + (1 - 0.05 * sink) + ')';
    btn.style.boxShadow = '0 ' + (1.6 - 1.2 * sink) + 'vh 0 color-mix(in srgb,var(--accent) 55%,black)';
  };
})();
</script>
