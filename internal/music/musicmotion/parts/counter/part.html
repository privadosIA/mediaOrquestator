<style>
#ct{position:absolute;left:0;right:0;top:18vh;text-align:center}
#ct .n{font-family:var(--display);font-weight:900;font-size:26vh;line-height:1;font-variant-numeric:tabular-nums}
#ct .u{margin-top:3vh;font-size:7vh;font-weight:700;color:var(--accent);text-transform:lowercase}
</style>
<div id="ct"><div class="n">0</div><div class="u">{{unit}}</div></div>
<script>
(function(){
  var P = window.__params, n = document.querySelector('#ct .n');
  function ease(p){ p = Math.min(1, Math.max(0, p)); return 1 - Math.pow(1 - p, 3); }
  window.__partSeek = function(t, b){
    var done = Math.max(0, b.number), v = P.from + P.step * done;
    if (b.number >= 0) v = P.from + P.step * (done + ease(b.position / 0.45) - 1);
    n.textContent = Math.max(0, Math.round(v)).toLocaleString('en-US');
    var lift = b.number < 0 ? 0 : Math.pow(1 - b.position, 3);
    n.style.transform = 'scale(' + (1 + 0.05 * lift) + ')';
  };
})();
</script>
