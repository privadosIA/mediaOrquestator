<style>
#dp{position:absolute;left:50%;top:7vh;width:108vh;margin-left:-54vh;padding:2.4vh 3.4vh 2.6vh;border-radius:2.2vh;background:color-mix(in srgb,var(--bg) 80%,var(--fg) 8%);border:.35vh solid color-mix(in srgb,var(--fg) 22%,transparent);font-family:var(--body)}
#dp .ttl{font-size:2.8vh;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--fg) 60%,transparent);margin-bottom:1.2vh}
#dp .line{display:none;align-items:center;gap:2.4vh;height:5.2vh;font-size:3.5vh}
#dp .line.on{display:flex}
#dp .name{flex:none;width:52vh;white-space:nowrap;overflow:hidden}
#dp .track{flex:1;height:1.7vh;border-radius:1vh;background:color-mix(in srgb,var(--fg) 14%,transparent);overflow:hidden}
#dp .track i{display:block;height:100%;width:0;background:var(--accent)}
</style>
<div id="dp"><div class="ttl">{{title}}</div><div class="lines"></div></div>
<script>
(function(){
  var P = window.__params, box = document.querySelector('#dp .lines'), lines = [];
  String(P.items).split('|').filter(function(s){ return s.trim() !== ''; }).forEach(function(s){
    var txt = s.trim(), depth = 0;
    while (txt.charAt(depth) === '-') depth++;
    txt = txt.slice(depth);
    var cut = txt.lastIndexOf(':'), tail = cut < 0 ? '' : txt.slice(cut + 1), hasValue = tail !== '' && /^[0-9.]+$/.test(tail);
    var name = hasValue ? txt.slice(0, cut) : txt, value = Math.min(1, Math.max(0, hasValue ? Number.parseFloat(tail) : 0.5));
    var l = document.createElement('div'); l.className = 'line';
    var n = document.createElement('div'); n.className = 'name'; n.style.paddingLeft = (depth * 4) + 'vh'; n.textContent = (depth ? '└ ' : '') + name;
    var tr = document.createElement('div'); tr.className = 'track'; var bar = document.createElement('i'); tr.appendChild(bar);
    l.appendChild(n); l.appendChild(tr); box.appendChild(l); lines.push({el: l, bar: bar, value: value});
  });
  function ease(p){ p = Math.min(1, Math.max(0, p)); return 1 - Math.pow(1 - p, 3); }
  window.__partSeek = function(t, b){
    var at = b.number < 0 ? 0 : b.number + b.position;
    lines.forEach(function(l, i){
      var born = at - i;                                           // line i enters on beat i (the first one at the start)
      l.el.classList.toggle('on', born >= -1e-9);
      l.bar.style.width = (l.value * 100 * ease(born / 1.4)) + '%';    // its bar grows over the beats after it enters
    });
  };
})();
</script>
