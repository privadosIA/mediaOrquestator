<style>
#ds{position:absolute;left:0;top:0;width:100%;height:78%;perspective:120vh;perspective-origin:50% 40%}
#ds .w{position:absolute;left:50%;top:44%;width:0;height:0;transform-style:preserve-3d}
#ds .p{position:absolute;left:-29vh;top:-12vh;width:58vh;height:24vh;border-radius:2.2vh;border:.5vh solid color-mix(in srgb,var(--fg) 40%,transparent);background:color-mix(in srgb,var(--fg) 8%,transparent);box-shadow:0 0 5vh color-mix(in srgb,var(--accent) 18%,transparent)}
#ds .p.a{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 24%,transparent)}
</style>
<div id="ds"><div class="w"></div></div>
<script>
(function(){
  var P = window.__params, w = document.querySelector('#ds .w'), plates = [];
  for (var i = 0; i < P.count; i++) { var p = document.createElement('div'); p.className = 'p' + (i === P.count - 1 ? ' a' : ''); w.appendChild(p); plates.push(p); }
  function ease(p){ p = Math.min(1, Math.max(0, p)); return 1 - Math.pow(1 - p, 3); }
  window.__partSeek = function(t, b){
    var open = b.number < 0 ? 0 : Math.pow(1 - b.position, 2);                 // fans out on the beat, closes after
    var spin = (b.number < 0 ? 0 : b.number + ease(b.position / 0.5)) * 14;      // a step of rotation per beat
    w.style.transform = 'rotateX(58deg) rotateZ(' + (-24 + spin) + 'deg)';
    plates.forEach(function(p, i){
      var z = (i - (P.count - 1) / 2) * (5 + 9 * open);
      p.style.transform = 'translateZ(' + z + 'vh)';
    });
  };
})();
</script>
