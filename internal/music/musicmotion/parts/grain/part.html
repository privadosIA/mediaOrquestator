<style>
#grn{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#grn canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;mix-blend-mode:overlay}
#grn .b{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 68%);mix-blend-mode:screen}
</style>
<div id="grn"><div id="grn-bokeh"></div><canvas id="grn-c" width="320" height="180"></canvas></div>
<script>
(function(){
  var P = window.__params || {}, cv = document.getElementById('grn-c'), ctx = cv.getContext('2d'), img = ctx.createImageData(320, 180);
  var box = document.getElementById('grn-bokeh'), discs = [], count = Math.max(0, Math.min(6, Math.trunc(P.bokeh) || 0));
  function rng(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  var fixed = rng(7);
  for (var i = 0; i < count; i++) {
    var d = document.createElement('div'); d.className = 'b'; box.appendChild(d);
    discs.push({el: d, x: fixed() * 100, y: fixed() * 100, size: 14 + fixed() * 22, sp: 0.04 + fixed() * 0.06, ph: fixed() * 6.28});
  }
  cv.style.opacity = String(Math.max(0, Math.min(1, P.intensity === undefined ? 0.35 : P.intensity)));
  window.__partSeek = function(t, beat){
    var frame = Math.floor(t * 24), r = rng(frame * 7919 + 13), data = img.data;
    for (var k = 0; k < data.length; k += 4) { var v = 96 + Math.floor(r() * 96); data[k] = v; data[k + 1] = v; data[k + 2] = v; data[k + 3] = 255; }
    ctx.putImageData(img, 0, 0);
    var pulse = beat.number < 0 ? 0 : 1 - beat.position;
    discs.forEach(function(o){
      var x = (o.x + 8 * Math.sin(t * o.sp * 6 + o.ph)) % 100, y = (o.y + 6 * Math.cos(t * o.sp * 5 + o.ph)) % 100, s = o.size * (1 + 0.08 * pulse);
      o.el.style.left = (x - s / 2) + 'vh'; o.el.style.top = (y - s / 2) + 'vh'; o.el.style.width = s + 'vh'; o.el.style.height = s + 'vh';
      o.el.style.opacity = String(0.10 + 0.06 * pulse);
    });
  };
})();
</script>
