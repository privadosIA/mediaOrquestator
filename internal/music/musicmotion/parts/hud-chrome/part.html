<style>
#hudc{position:absolute;inset:0;pointer-events:none;font-family:var(--body);color:var(--fg);text-transform:uppercase;letter-spacing:.14em;font-size:1.7vh}
#hudc .c{position:absolute;opacity:.72;white-space:nowrap}
#hudc .tl{left:3vw;top:3.2vh}#hudc .tr{right:3vw;top:3.2vh;text-align:right}
#hudc .bl{left:3vw;bottom:3.2vh}#hudc .br{right:3vw;bottom:3.2vh;text-align:right}
#hudc .mid{position:absolute;left:50%;transform:translateX(-50%);opacity:.55;white-space:nowrap}
#hudc .top{top:3.2vh}#hudc .bot{bottom:3.2vh}
#hudc .rule{position:absolute;left:3vw;right:3vw;height:1px;background:var(--fg);opacity:.22}
#hudc .rt{top:7vh}#hudc .rb{bottom:7vh}
#hudc .dot{display:inline-block;width:.9vh;height:.9vh;border-radius:50%;background:var(--accent);margin-right:.8vh;vertical-align:middle}
</style>
<div id="hudc">
  <div class="rule rt" id="hudc-rt"></div><div class="rule rb" id="hudc-rb"></div>
  <div class="c tl"><span class="dot" id="hudc-dot"></span><span id="hudc-tl"></span></div><div class="c tr" id="hudc-tr"></div>
  <div class="c bl" id="hudc-bl"></div><div class="c br" id="hudc-br"></div>
  <div class="mid top" id="hudc-sec"></div><div class="mid bot" id="hudc-time"></div>
</div>
<script>
(function(){
  var P = window.__params || {}, H = (window.__theme && window.__theme.hud) || {}, S = window.__scene || {};
  function $(id){ return document.getElementById('hudc-' + id); }
  // the theme's texts first, the parameters second
  ['tl', 'tr', 'bl', 'br'].forEach(function(k){ $(k).textContent = H[k] || P[k] || ''; });
  if (!P.rule) { $('rt').style.display = 'none'; $('rb').style.display = 'none'; }
  function pad(n, w){ var s = String(Math.floor(n)); while (s.length < w) s = '0' + s; return s; }
  window.__partSeek = function(t, beat){
    var n = beat.number < 0 ? 0 : beat.number, pos = beat.number < 0 ? 0 : beat.position;
    $('dot').style.opacity = String(pos < 0.5 ? 1 : 0.25);
    $('sec').textContent = P.show_section ? (beat.section || '') + (beat.section ? ' / ' : '') + pad(n + 1, 2) : '';
    var at = (S.song_start || 0) + t;
    $('time').textContent = P.show_time ? pad(at / 60, 2) + ':' + pad(at % 60, 2) + '.' + pad((at % 1) * 100, 2) : '';
  };
})();
</script>
