<canvas id="nb"></canvas>
<script>
(function(){
  var P = window.__params, cv = document.getElementById('nb'), W = window.innerWidth, H = window.innerHeight;
  cv.width = W; cv.height = H; cv.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%';
  var cx = cv.getContext('2d');
  function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  var accent = css('--accent'), fg = css('--fg');
  // a small seeded generator: the same seed gives the same cloud
  var s = (P.seed * 2654435761 + 12345) >>> 0;
  function rnd(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
  var parts = [], i, centres = [[0.3, 0.38], [0.68, 0.5], [0.5, 0.3]];
  for (i = 0; i < P.amount; i++) {
    var c = centres[Math.floor(rnd() * centres.length)], a = rnd() * Math.PI * 2, r = Math.pow(rnd(), 0.7) * 0.28;
    parts.push({x: c[0] + Math.cos(a) * r * 0.9, y: c[1] + Math.sin(a) * r * 0.6, size: 0.012 + rnd() * 0.05, hot: rnd(), ph: rnd() * 6.283, drift: 0.2 + rnd() * 0.8});
  }
  window.__partSeek = function(t, b){
    cx.clearRect(0, 0, W, H);
    var lift = b.number < 0 ? 0 : Math.pow(1 - b.position, 3);
    parts.forEach(function(p){
      var x = (p.x + 0.012 * Math.sin(t * 0.4 * p.drift + p.ph)) * W, y = (p.y + 0.012 * Math.cos(t * 0.35 * p.drift + p.ph)) * H, r = p.size * H * (1 + 0.18 * lift);
      var g = cx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, p.hot > 0.7 ? fg : accent); g.addColorStop(1, 'rgba(0,0,0,0)');
      cx.globalAlpha = 0.16 + 0.12 * lift; cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
    });
    cx.globalAlpha = 1;
  };
})();
</script>
