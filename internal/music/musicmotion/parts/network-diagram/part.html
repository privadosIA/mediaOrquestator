<canvas id="nd"></canvas>
<script>
(function(){
  var P = window.__params, cv = document.getElementById('nd'), W = window.innerWidth, H = window.innerHeight;
  cv.width = W; cv.height = H; cv.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%';
  var cx = cv.getContext('2d');
  function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  var accent = css('--accent'), fg = css('--fg');
  var L = P.layers, N = P.nodes, x0 = W * 0.12, x1 = W * 0.88, y0 = H * 0.16, y1 = H * 0.7;
  function pos(l, n){ return [x0 + (x1 - x0) * l / (L - 1), y0 + (y1 - y0) * (n + 0.5) / N]; }
  window.__partSeek = function(t, b){
    cx.clearRect(0, 0, W, H);
    var beats = b.number < 0 ? 0 : b.number + b.position, lit = Math.min(L, beats * 0.9 + 0.2), lift = b.number < 0 ? 0 : Math.pow(1 - b.position, 3);
    var l, n, m;
    cx.lineWidth = Math.max(1, H * 0.0025);
    for (l = 0; l < L - 1; l++) {
      var on = Math.max(0, Math.min(1, lit - l - 0.5));
      for (n = 0; n < N; n++) for (m = 0; m < N; m++) {
        if ((n * 7 + m * 3 + l) % 3 === 0) continue;
        var a = pos(l, n), c = pos(l + 1, m);
        cx.strokeStyle = on > 0 ? accent : fg; cx.globalAlpha = on > 0 ? 0.15 + 0.5 * on : 0.12;
        cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(c[0], c[1]); cx.stroke();
      }
    }
    for (l = 0; l < L; l++) {
      var lo = Math.max(0, Math.min(1, lit - l));
      for (n = 0; n < N; n++) {
        var p = pos(l, n), r = H * 0.018 * (1 + (lo > 0 && lo < 1 ? 0.5 : 0) + 0.3 * lift * lo);
        cx.globalAlpha = 1; cx.fillStyle = lo > 0 ? accent : fg;
        if (lo <= 0) cx.globalAlpha = 0.3;
        cx.beginPath(); cx.arc(p[0], p[1], r, 0, Math.PI * 2); cx.fill();
      }
    }
    cx.globalAlpha = 1;
  };
})();
</script>
