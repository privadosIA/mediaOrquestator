<style>
#pc{position:absolute;left:0;top:0;width:100%;height:78%;overflow:hidden}
#pc .l{position:absolute;left:0;top:0;width:100%;height:100%}
#pc .c{position:absolute;border-radius:2vh;background:color-mix(in srgb,var(--fg) 10%,transparent);border:.3vh solid color-mix(in srgb,var(--fg) 22%,transparent)}
#pc .c.a{background:color-mix(in srgb,var(--accent) 80%,transparent);border-color:var(--accent)}
#pc .front{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:6vh;color:var(--fg);background:color-mix(in srgb,var(--bg) 70%,var(--fg) 12%);border-color:var(--accent)}
</style>
<div id="pc"></div>
<script>
(function(){
  var P = window.__params, root = document.getElementById('pc'), layers = [];
  function rnd(seed){ var s = seed >>> 0; return function(){ s = (s + 0x6D2B79F5) >>> 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  for (var li = 0; li < P.layers; li++) {
    var el = document.createElement('div'); el.className = 'l'; root.appendChild(el);
    var r = rnd(97 + li * 31), depth = (li + 1) / P.layers, cards = [];
    var n = 9 - li * 2;
    for (var i = 0; i < n; i++) {
      var c = document.createElement('div'); c.className = 'c' + (r() < 0.18 ? ' a' : '');
      var w = (14 + r() * 14) * (0.6 + depth * 0.7), h = (9 + r() * 10) * (0.6 + depth * 0.7);
      c.style.width = w + 'vh'; c.style.height = h + 'vh'; c.style.left = (i * (130 / n) - 20 + r() * 6) + '%'; c.style.top = (6 + r() * 56) + '%';
      el.appendChild(c);
    }
    layers.push({el: el, depth: depth, dir: li % 2 ? -1 : 1});
  }
  var front = document.createElement('div'); front.className = 'c front'; front.textContent = P.label;
  front.style.cssText += ';left:50%;top:42%;width:46vh;height:17vh;margin:-8.5vh 0 0 -23vh;z-index:3';
  root.appendChild(front);
  function ease(p){ p = Math.min(1, Math.max(0, p)); return 1 - Math.pow(1 - p, 3); }
  window.__partSeek = function(t, b){
    var jump = b.number < 0 ? 0 : (b.number + ease(b.position / 0.4));
    layers.forEach(function(l){
      var x = l.dir * (t * 1.6 * l.depth + jump * 2.2 * l.depth);
      l.el.style.transform = 'translateX(' + (x % 40 - 20) + 'vh)';
    });
    var lift = b.number < 0 ? 0 : Math.pow(1 - b.position, 3);
    front.style.transform = 'scale(' + (1 + 0.06 * lift) + ')';
  };
})();
</script>
