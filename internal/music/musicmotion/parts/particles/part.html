<canvas id="pt"></canvas>
<script>
(function(){
  var P = window.__params, cv = document.getElementById('pt'), W = window.innerWidth, H = window.innerHeight;
  cv.width = W; cv.height = H; cv.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%';
  var cx = cv.getContext('2d');
  function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  var fg = css('--fg'), accent = css('--accent');
  function rnd(seed){ var s = seed >>> 0; return function(){ s = (s + 0x6D2B79F5) >>> 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var LIFE = 2.0, DRAG = 2.2, KEEP = 5;
  function pos(p, dt){ var k = (1 - Math.exp(-DRAG * dt)) / DRAG; return {x: p.x0 + p.vx * k, y: p.y0 + p.vy * k + 0.04 * H * dt * dt}; }
  window.__partSeek = function(t, b){
    cx.clearRect(0, 0, W, H);
    if (b.number < 0 || !(b.bpm > 0)) return;
    var period = b.period > 0 ? b.period : 60 / b.bpm, start = t - b.position * period;       // when the current beat began
    for (var k = b.number; k >= Math.max(0, b.number - KEEP); k--) {
      var t0 = start - (b.number - k) * period, age = t - t0;
      if (age < 0 || age > LIFE) continue;
      var r = rnd(1009 * (k + 1)), fade = 1 - age / LIFE;
      for (var i = 0; i < P.amount; i++) {
        var ang = r() * Math.PI * 2, sp = (0.2 + r() * 0.9) * H * 1.1, size = (0.004 + r() * 0.008) * H, hot = r() < 0.3;
        var p = {x0: W / 2, y0: H * 0.38, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp};
        var a = pos(p, age), c = hot ? accent : fg;
        if (P.streak > 0) { var bk = pos(p, Math.max(0, age - P.streak)); cx.globalAlpha = 0.55 * fade; cx.strokeStyle = c; cx.lineWidth = size * 1.4; cx.lineCap = 'round'; cx.beginPath(); cx.moveTo(bk.x, bk.y); cx.lineTo(a.x, a.y); cx.stroke(); }
        cx.globalAlpha = fade; cx.fillStyle = c; cx.beginPath(); cx.arc(a.x, a.y, size, 0, Math.PI * 2); cx.fill();
      }
    }
    cx.globalAlpha = 1;
  };
})();
</script>
