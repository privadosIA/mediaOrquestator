<style>
#pw{position:absolute;left:50%;top:12vh;width:100vh;margin-left:-50vh}
#pw .lab{font-size:4.6vh;font-weight:700;margin-bottom:2.2vh}
#pw .field{padding:3vh 4vh;border-radius:1.6vh;background:color-mix(in srgb,var(--fg) 8%,transparent);border:.45vh solid color-mix(in srgb,var(--fg) 34%,transparent);font-size:8vh;font-weight:700;letter-spacing:.1em;min-height:9vh;white-space:nowrap;overflow:hidden}
#pw .cur{display:inline-block;width:.1em;height:.95em;vertical-align:-.12em;background:var(--accent)}
#pw .meter{display:flex;align-items:center;gap:1.6vh;margin-top:2.6vh}
#pw .steps{display:flex;gap:1.2vh;flex:1}
#pw .steps i{flex:1;height:2.4vh;border-radius:.6vh;background:color-mix(in srgb,var(--fg) 14%,transparent)}
#pw .steps i.on{background:var(--fg)}
#pw .steps i.on.weak{background:var(--accent)}
#pw .word{font-size:4vh;font-weight:900;text-transform:lowercase;min-width:16vh;text-align:right}
#pw .word.weak{color:var(--accent)}
</style>
<div id="pw"><div class="lab">{{label}}</div><div class="field"><span class="dots"></span><span class="cur"></span></div><div class="meter"><div class="steps"><i></i><i></i><i></i><i></i><i></i></div><div class="word"></div></div></div>
<script>
(function(){
  var P = window.__params, dots = document.querySelector('#pw .dots'), cur = document.querySelector('#pw .cur'), steps = Array.from(document.querySelectorAll('#pw .steps i')), word = document.querySelector('#pw .word');
  var n = Array.from(String(P.password)).length, words = ['', 'weak', 'weak', 'fair', 'good', 'strong'];
  window.__partSeek = function(t, b){
    var at = b.number < 0 ? 0 : b.number + b.position;
    var shown = Math.min(n, Math.floor(at * P.per_beat));          // one more dot on every beat
    dots.textContent = '•'.repeat(shown);
    cur.style.opacity = b.position < 0.5 ? '1' : '0.15';
    var typed = n / P.per_beat, filled = at >= typed ? Math.min(P.strength, Math.floor((at - typed) * 2) + 1) : 0;   // the bar fills after the typing
    steps.forEach(function(s, i){ s.classList.toggle('on', i < filled); s.classList.toggle('weak', P.strength <= 2); });
    word.textContent = filled > 0 ? words[Math.min(P.strength, 5)] : '';
    word.classList.toggle('weak', P.strength <= 2);
  };
})();
</script>
