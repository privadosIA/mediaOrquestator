<style>
#sx{position:absolute;left:50%;top:10vh;width:112vh;margin-left:-56vh}
#sx .field{display:flex;align-items:center;gap:2.4vh;padding:2.6vh 3.4vh;border-radius:6vh;background:color-mix(in srgb,var(--fg) 10%,transparent);border:.4vh solid color-mix(in srgb,var(--fg) 30%,transparent);font-size:5vh;font-weight:700;white-space:nowrap;overflow:hidden}
#sx .mag{flex:none;width:4.6vh;height:4.6vh;border:.7vh solid color-mix(in srgb,var(--fg) 70%,transparent);border-radius:50%;position:relative}
#sx .mag:after{content:"";position:absolute;right:-2.2vh;bottom:-1.6vh;width:2.6vh;height:.7vh;background:color-mix(in srgb,var(--fg) 70%,transparent);transform:rotate(45deg)}
#sx .cur{display:inline-block;width:.12em;height:1.05em;vertical-align:-.15em;margin-left:.08em;background:var(--accent)}
#sx .list{margin-top:1.6vh;border-radius:2.4vh;overflow:hidden;background:color-mix(in srgb,var(--bg) 78%,var(--fg) 10%);border:.35vh solid color-mix(in srgb,var(--fg) 22%,transparent)}
#sx .item{padding:1.7vh 3.6vh;font-size:3.9vh;font-family:var(--body);display:none}
#sx .item.on{display:block}
#sx .item.first{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--fg)}
#sx .item b{color:var(--accent)}
</style>
<div id="sx"><div class="field"><span class="mag"></span><span class="q"></span><span class="cur"></span></div><div class="list"></div></div>
<script>
(function(){
  var P = window.__params, box = document.getElementById('sx'), q = box.querySelector('.q'), cur = box.querySelector('.cur'), list = box.querySelector('.list');
  var items = String(P.suggestions).split('|').filter(function(s){ return s.trim() !== ''; }), els = [];
  items.forEach(function(s, i){ var d = document.createElement('div'); d.className = 'item' + (i === 0 ? ' first' : ''); d.textContent = s; list.appendChild(d); els.push(d); });
  var phrase = Array.from(String(P.query));
  window.__partSeek = function(t, b){
    var at = b.number < 0 ? 0 : b.number + b.position;          // beats since the start
    var typed = Math.floor(phrase.length * Math.min(1, at / P.type_beats));
    q.textContent = phrase.slice(0, typed).join('');
    cur.style.opacity = (b.position < 0.5 || at >= P.type_beats + 1) ? '1' : '0.15';
    var shown = Math.min(els.length, Math.floor(at));            // one more suggestion on every beat
    els.forEach(function(e, i){ e.classList.toggle('on', i < shown); });
    list.style.display = shown > 0 ? 'block' : 'none';
  };
})();
</script>
