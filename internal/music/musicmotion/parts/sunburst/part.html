<style>
#sb{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
#sb .rays{position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;border-radius:50%}
</style>
<div id="sb"><div class="rays"></div></div>
<script>
(function(){
  var P = window.__params, el = document.querySelector('#sb .rays');
  var step = 360 / P.rays;
  // Alternate rays of the accent and of the background, with a soft centre.
  el.style.background = 'repeating-conic-gradient(from 0deg, color-mix(in srgb,var(--accent) 38%,var(--bg)) 0deg ' + (step / 2) + 'deg, var(--bg) ' + (step / 2) + 'deg ' + step + 'deg)';
  var glow = document.createElement('div');
  glow.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(circle at 50% 50%, color-mix(in srgb,var(--accent) 35%,transparent) 0%, transparent 38%)';
  document.getElementById('sb').appendChild(glow);
  window.__partSeek = function(t, b){
    var lift = b.number < 0 ? 0 : Math.pow(1 - b.position, 3);
    el.style.transform = 'rotate(' + (t * P.spin + (b.number < 0 ? 0 : b.number * 2 + lift * 3)) + 'deg) scale(' + (1 + 0.04 * lift) + ')';
    glow.style.opacity = String(0.7 + 0.3 * lift);
  };
})();
</script>
