<style>
#tg{position:absolute;left:0;right:0;top:12vh;display:flex;flex-direction:column;align-items:center;gap:4.5vh}
.tg-row{display:flex;align-items:center;gap:4vh}
.tg-lab{min-width:30vh;text-align:right;font-family:var(--display);font-weight:900;font-size:7vh;text-transform:lowercase}
.tg-track{width:22vh;height:11vh;border-radius:11vh;background:color-mix(in srgb,var(--fg) 18%,transparent);position:relative;border:.5vh solid color-mix(in srgb,var(--fg) 35%,transparent)}
.tg-knob{position:absolute;top:.9vh;left:.9vh;width:8.2vh;height:8.2vh;border-radius:50%;background:var(--fg)}
</style>
<div id="tg"></div>
<script>
(function(){
  var P = window.__params, root = document.getElementById('tg'), rows = [];
  for (var i = 0; i < P.count; i++) {
    var row = document.createElement('div'); row.className = 'tg-row';
    var lab = document.createElement('div'); lab.className = 'tg-lab'; lab.textContent = i === 0 ? P.label : '';
    var tr = document.createElement('div'); tr.className = 'tg-track';
    var kn = document.createElement('div'); kn.className = 'tg-knob'; tr.appendChild(kn);
    row.appendChild(lab); row.appendChild(tr); root.appendChild(row); rows.push({tr: tr, kn: kn});
  }
  function ease(p){ p = Math.min(1, Math.max(0, p)); return 1 - Math.pow(1 - p, 3); }
  window.__partSeek = function(t, b){
    var n = Math.max(0, b.number), c = P.count, travel = 11.0;
    rows.forEach(function(r, i){
      var flips = Math.floor((n + c - i) / c);            // how many times switch i has flipped
      var flipping = ((n + c - i) % c) === 0 && n >= 0 && b.number >= 0;   // it flips on this very beat
      var from = (flips - (flipping ? 1 : 0)) % 2, to = flips % 2;
      var k = flipping ? ease(b.position / 0.3) : 1;
      var on = from + (to - from) * k;
      r.kn.style.transform = 'translateX(' + (on * travel) + 'vh)';
      r.tr.style.background = on > 0.5 ? 'var(--accent)' : 'color-mix(in srgb,var(--fg) 18%,transparent)';
      r.tr.style.borderColor = on > 0.5 ? 'var(--accent)' : 'color-mix(in srgb,var(--fg) 35%,transparent)';
    });
  };
})();
</script>
