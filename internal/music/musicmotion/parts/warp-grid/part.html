<canvas id="wg"></canvas>
<script>
(function(){
  var P = window.__params, cv = document.getElementById('wg'), W = window.innerWidth, H = window.innerHeight;
  cv.width = W; cv.height = H; cv.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%';
  var cx = cv.getContext('2d');
  function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  var accent = css('--accent'), fg = css('--fg');
  var N = P.density;
  function light(t){ return [W * (0.5 + 0.28 * Math.sin(t * 0.9)), H * (0.42 + 0.18 * Math.sin(t * 1.3 + 1))]; }
  // a point of the mesh, pushed away from the light: the nearer, the more
  function warp(x, y, L, k){
    var dx = x - L[0], dy = y - L[1], d = Math.sqrt(dx * dx + dy * dy) + 1, pull = k * H * 0.12 * Math.exp(-d / (H * 0.25));
    return [x + dx / d * pull, y + dy / d * pull];
  }
  window.__partSeek = function(t, b){
    cx.clearRect(0, 0, W, H);
    var lift = b.number < 0 ? 0 : Math.pow(1 - b.position, 3), L = light(t), k = 1 + 0.6 * lift;
    var x0 = W * 0.08, x1 = W * 0.92, y0 = H * 0.12, y1 = H * 0.78;
    cx.strokeStyle = fg; cx.lineWidth = Math.max(1, H * 0.002); cx.globalAlpha = 0.35;
    for (var i = 0; i <= N; i++) {
      var u = i / N;
      cx.beginPath();
      for (var j = 0; j <= 120; j++) { var v = j / 120, p = warp(x0 + (x1 - x0) * u, y0 + (y1 - y0) * v, L, k); if (j === 0) cx.moveTo(p[0], p[1]); else cx.lineTo(p[0], p[1]); }
      cx.stroke();
      cx.beginPath();
      for (var m = 0; m <= 120; m++) { var w = m / 120, q = warp(x0 + (x1 - x0) * w, y0 + (y1 - y0) * u, L, k); if (m === 0) cx.moveTo(q[0], q[1]); else cx.lineTo(q[0], q[1]); }
      cx.stroke();
    }
    // the trail of the light: the places it has been in the last moments, fading
    cx.fillStyle = accent;
    for (var s = 24; s >= 0; s--) { var pt = light(t - s * 0.04); cx.globalAlpha = (1 - s / 25) * 0.8; cx.beginPath(); cx.arc(pt[0], pt[1], H * (0.006 + 0.012 * (1 - s / 25)) * (1 + 0.5 * lift), 0, Math.PI * 2); cx.fill(); }
    cx.globalAlpha = 1;
  };
})();
</script>
