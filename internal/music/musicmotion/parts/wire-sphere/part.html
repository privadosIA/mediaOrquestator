<canvas id="ws"></canvas>
<script>
(function(){
  var P = window.__params, cv = document.getElementById('ws'), W = window.innerWidth, H = window.innerHeight;
  cv.width = W; cv.height = H; cv.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%';
  var cx = cv.getContext('2d');
  function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  var fg = css('--fg'), accent = css('--accent');
  function rnd(seed){ var s = seed >>> 0; return function(){ s = (s + 0x6D2B79F5) >>> 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var r = rnd(7), pts = [];
  for (var i = 0; i < P.dots; i++) { pts.push({lat: Math.asin(2 * r() - 1), lon: r() * Math.PI * 2}); }
  function ease(p){ p = Math.min(1, Math.max(0, p)); return 1 - Math.pow(1 - p, 3); }
  function proj(lat, lon, rot, tilt, R, ox, oy){
    var x = Math.cos(lat) * Math.sin(lon + rot), y = Math.sin(lat), z = Math.cos(lat) * Math.cos(lon + rot);
    var y2 = y * Math.cos(tilt) - z * Math.sin(tilt), z2 = y * Math.sin(tilt) + z * Math.cos(tilt);
    return {x: ox + x * R, y: oy - y2 * R, z: z2};
  }
  window.__partSeek = function(t, b){
    cx.clearRect(0, 0, W, H);
    var lift = b.number < 0 ? 0 : Math.pow(1 - b.position, 3);
    var R = H * 0.3 * (1 + 0.05 * lift), ox = W / 2, oy = H * 0.4, tilt = 0.45;
    var rot = 0.15 * t + (b.number < 0 ? 0 : (b.number + ease(b.position / 0.5)) * 0.35);
    cx.lineWidth = Math.max(1.5, H * 0.003);
    var steps = 48;
    function line(f, isLat){
      var prev = null;
      for (var s = 0; s <= steps; s++) {
        var u = s / steps, p = isLat ? proj(f, u * Math.PI * 2, rot, tilt, R, ox, oy) : proj(-Math.PI / 2 + u * Math.PI, f, rot, tilt, R, ox, oy);
        if (prev) { cx.globalAlpha = (p.z + prev.z) / 2 >= 0 ? 0.9 : 0.22; cx.strokeStyle = fg; cx.beginPath(); cx.moveTo(prev.x, prev.y); cx.lineTo(p.x, p.y); cx.stroke(); }
        prev = p;
      }
    }
    for (var i = 1; i < P.rings; i++) line(-Math.PI / 2 + i * Math.PI / P.rings, true);
    for (var j = 0; j < P.rings; j++) line(j * Math.PI * 2 / P.rings, false);
    cx.fillStyle = accent;
    pts.forEach(function(d, k){
      var p = proj(d.lat, d.lon, rot, tilt, R, ox, oy);
      cx.globalAlpha = p.z >= 0 ? 1 : 0.25;
      var pulse = (b.number >= 0 && (b.number % Math.max(1, pts.length)) === k) ? 1 + 1.2 * lift : 1;
      cx.beginPath(); cx.arc(p.x, p.y, H * 0.011 * pulse, 0, Math.PI * 2); cx.fill();
    });
    cx.globalAlpha = 1;
  };
})();
</script>
