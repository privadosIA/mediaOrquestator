<style>
#ex{position:absolute;inset:0;overflow:hidden}
#ex .ring{position:absolute;left:50%;top:50%;width:84vh;height:84vh;margin:-42vh 0 0 -42vh;border:1.2vh solid var(--accent);border-radius:50%}
#ex .words{position:absolute;left:8vw;right:8vw;top:30vh;text-align:center;font-family:var(--display);font-weight:900;font-size:13vh;line-height:1.05;text-transform:uppercase;color:var(--fg)}
#ex .w{display:inline-block;margin:0 .16em;opacity:0}
#ex .w.k{color:var(--accent)}
</style>
<div id="ex"><div class="ring" id="ex-ring"></div><div class="words" id="ex-words"></div></div>
<script>
(function(){
  var S = window.__scene, ring = document.getElementById('ex-ring'), box = document.getElementById('ex-words');
  var spans = [], lineOf = [];
  S.lines.forEach(function(l, li){
    var words = l.words && l.words.length ? l.words : [{t: l.text, s: l.start, e: l.end}];
    words.forEach(function(w, i){
      var s = document.createElement('span'); s.className = 'w' + (i === l.keyword ? ' k' : ''); s.textContent = w.t; s.style.display = 'none';
      box.appendChild(s); spans.push({el: s, start: w.s, line: li});
    });
  });
  function ease(p){ p = Math.min(1, Math.max(0, p)); return 1 - Math.pow(1 - p, 3); }
  function overshoot(p){ p = Math.min(1, Math.max(0, p)); var c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }
  window.__partSeek = function(t, beat){
    var pos = beat.number < 0 ? 0 : beat.position, n = beat.number < 0 ? 0 : beat.number;
    var punch = 1 - ease(pos * 2.5);
    ring.style.transform = 'scale(' + (1 + 0.16 * punch + 0.04 * Math.sin(t * 0.8)) + ') rotate(' + (n * 12 + pos * 12) + 'deg)';
    ring.style.opacity = String(0.55 + 0.45 * punch);
    var cur = -1;
    for (var i = 0; i < S.lines.length; i++) { if (t >= S.lines[i].start - 1e-9) cur = i; }
    spans.forEach(function(o){
      var show = o.line === cur; o.el.style.display = show ? 'inline-block' : 'none';
      if (!show) return;
      var p = overshoot((t - o.start) / 0.35), vis = t >= o.start - 1e-9 ? 1 : 0;
      o.el.style.opacity = String(vis * Math.min(1, (t - o.start) / 0.12));
      o.el.style.transform = 'translateY(' + ((1 - p) * 6) + 'vh) scale(' + (0.8 + 0.2 * p) + ')';
    });
  };
})();
</script>
